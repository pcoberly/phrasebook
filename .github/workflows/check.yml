# Runs the release checks on every push and pull request, so a change made from a phone is checked too.
# A failure shows a red ✗ beside the commit on GitHub and GitHub emails the person who pushed it.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Phrase data, audio and version
        run: python check_data.py
      - name: Service worker
        run: node tests/sw-test.js
