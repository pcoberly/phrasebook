<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhraseBook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-v3-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PhraseBook">
<meta name="theme-color" content="#b3261e">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav>
    <button data-mode="list" class="tab active">List</button>
    <button data-mode="cards" class="tab">Cards</button>
    <button data-mode="quiz" class="tab">Quiz</button>
    <button data-mode="guide" class="tab">Guide</button>
    <button data-mode="settings" class="tab gear" aria-label="Settings">⚙</button>
  </nav>
  <div class="opts">
    <select id="cat" aria-label="Topic"></select>
    <select id="dir" aria-label="Direction">
      <option value="mixed">Both Directions</option>
    </select>
    <label class="check"><input type="checkbox" id="listen"> Listening only</label>
  </div>
</header>
<main id="main"></main>
<footer id="status"></footer>
<script src="app.js"></script>
</body>
</html>
