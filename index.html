<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhraseBook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="icon-v3-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PhraseBook">
<meta name="theme-color" content="#b3261e">
<link rel="stylesheet" href="style.css">
<style>
  /* the splash, shown from the first moment while the app loads; here so it needs nothing else to arrive first */
  html { background: #faf8f5; }
  #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #faf8f5; color: #1d1b1a; font: 600 22px -apple-system, system-ui, sans-serif; transition: opacity .4s ease; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; animation: splash 1.6s ease-in-out infinite; }
  #splash.gone { opacity: 0; pointer-events: none; }
  @keyframes splash { 50% { transform: scale(.94); opacity: .8; } }
  @media (prefers-color-scheme: dark) { html, #splash { background: #161413; color: #f1ece7; } }
  @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icon-v3-180.png" alt="">PhraseBook</div>
<header>
  <nav>
    <button data-mode="list" class="tab active" data-t="List">List</button>
    <button data-mode="cards" class="tab" data-t="Cards">Cards</button>
    <button data-mode="quiz" class="tab" data-t="Quiz">Quiz</button>
    <button data-mode="guide" class="tab" data-t="Guide">Guide</button>
    <button data-mode="settings" class="tab gear" aria-label="Settings" data-t-aria="Settings">⚙</button>
  </nav>
  <div class="opts">
    <button id="cat" class="topics" aria-haspopup="dialog">All Topics</button>
    <dialog id="topicmenu" aria-label="Topics" data-t-aria="Topics"></dialog>
    <select id="dir" aria-label="Direction" data-t-aria="Direction">
      <option value="mixed">Both Directions</option>
    </select>
    <label class="check"><input type="checkbox" id="listen"> <span data-t="Listening only">Listening only</span></label>
    <button id="mute" class="mute" aria-pressed="false">🔊 Sound on</button>
  </div>
</header>
<main id="main"></main>
<footer id="status"></footer>
<script src="app.js"></script>
</body>
</html>
