<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhraseBook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="icon-v3-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PhraseBook">
<meta name="theme-color" content="#b3261e">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav>
    <button data-mode="list" class="tab active" data-t="List">List</button>
    <button data-mode="cards" class="tab" data-t="Cards">Cards</button>
    <button data-mode="quiz" class="tab" data-t="Quiz">Quiz</button>
    <button data-mode="guide" class="tab" data-t="Guide">Guide</button>
    <button data-mode="settings" class="tab gear" aria-label="Settings" data-t-aria="Settings">⚙</button>
  </nav>
  <div class="opts">
    <button id="cat" class="topics" aria-haspopup="dialog">All Topics</button>
    <dialog id="topicmenu" aria-label="Topics" data-t-aria="Topics"></dialog>
    <select id="dir" aria-label="Direction" data-t-aria="Direction">
      <option value="mixed">Both Directions</option>
    </select>
    <label class="check"><input type="checkbox" id="listen"> <span data-t="Listening only">Listening only</span></label>
    <button id="mute" class="mute" aria-pressed="false">🔊 Sound on</button>
  </div>
</header>
<main id="main"></main>
<footer id="status"></footer>
<script src="app.js"></script>
</body>
</html>
