<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhraseBook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="icon-v3-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PhraseBook">
<meta name="theme-color" content="#b3261e">
<link rel="stylesheet" href="style.css">
<style>
  /* the splash, shown from the first moment while the app loads; here so it needs nothing else to arrive first */
  html { background: #faf8f5; }
  #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #faf8f5; color: #1d1b1a; font: 600 22px -apple-system, system-ui, sans-serif; transition: opacity .4s ease; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; animation: splash 1.6s ease-in-out infinite; }
  #splash.gone { opacity: 0; pointer-events: none; }
  @keyframes splash { 50% { transform: scale(.94); opacity: .8; } }
  @media (prefers-color-scheme: dark) { html, #splash { background: #161413; color: #f1ece7; } }
  @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icon-v3-180.png" alt="">PhraseBook</div>
<header>
  <nav>
    <button data-mode="list" class="tab active"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3" class="dot"/><circle cx="4.5" cy="12" r="1.3" class="dot"/><circle cx="4.5" cy="18" r="1.3" class="dot"/></svg><span class="tl" data-t="List">List</span></button>
    <button data-mode="cards" class="tab"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7.5" width="14" height="12.5" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v11"/></svg><span class="tl" data-t="Cards">Cards</span></button>
    <button data-mode="quiz" class="tab"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.5"/><circle cx="12" cy="17" r="1.1" class="dot"/></svg><span class="tl" data-t="Quiz">Quiz</span></button>
    <button data-mode="guide" class="tab"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2.5 2.5 0 0 1 2.5-2.5H21z"/></svg><span class="tl" data-t="Guide">Guide</span></button>
    <button data-mode="more" class="tab"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" class="dot"/><circle cx="12" cy="12" r="1.8" class="dot"/><circle cx="19" cy="12" r="1.8" class="dot"/></svg><span class="tl" data-t="More">More</span></button>
  </nav>
  <div class="opts">
    <button id="cat" class="topics" aria-haspopup="dialog">All Topics</button>
    <dialog id="topicmenu" aria-label="Topics" data-t-aria="Topics"></dialog>
    <select id="dir" aria-label="Direction" data-t-aria="Direction">
      <option value="mixed">Both Directions</option>
    </select>
    <label class="check"><input type="checkbox" id="listen"> <span data-t="Listening only">Listening only</span></label>
    <button id="mute" class="mute" aria-pressed="false">🔊 Sound on</button>
    <button id="searchbtn" class="searchbtn" aria-label="Search" data-t-aria="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
    <div class="search" hidden><input id="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="qclose" class="qclose" aria-label="Close search" data-t-aria="Close search">✕</button></div>
  </div>
</header>
<main id="main"></main>
<footer id="status"></footer>
<script src="app.js"></script>
</body>
</html>
